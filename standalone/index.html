<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dede Maulana — Portofolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#fff;--bg2:#f5f3ff;--card:#fff;--tx:#1e1b2e;--mu:#6b6880;--bd:#e8e4f5;--pr:#5b21b6;--pr2:#7c3aed;--soft:#ede9fe;--sh:0 8px 30px rgba(91,33,182,.08);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d1a;--bg2:#161326;--card:#1b1830;--tx:#f1eefc;--mu:#a29fbd;--bd:#2c2848;--pr:#a78bfa;--pr2:#8b5cf6;--soft:#2a2350;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0d1a;--bg2:#161326;--card:#1b1830;--tx:#f1eefc;--mu:#a29fbd;--bd:#2c2848;--pr:#a78bfa;--pr2:#8b5cf6;--soft:#2a2350;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;overflow-x:hidden;transition:background .4s,color .4s}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
section{padding:88px 0}.alt{background:var(--bg2)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pr);text-align:center}
h2{font-size:clamp(26px,4vw,38px);font-weight:800;text-align:center;margin:8px 0 12px;letter-spacing:-.02em}
.sub{color:var(--mu);text-align:center;max-width:560px;margin:0 auto 44px;font-size:15px}
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--pr),#c084fc);z-index:100;width:0}
#glow{position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(124,58,237,.14),transparent 65%);transform:translate(-50%,-50%);z-index:0;transition:opacity .3s}
nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:15px;text-decoration:none;color:var(--tx)}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--pr);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.links{display:flex;gap:4px}.links a{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mu);text-decoration:none;transition:.25s}
.links a:hover{color:var(--pr)}.links a.on{background:var(--pr);color:#fff}
.nr{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:12px;font:700 14px inherit;font-family:inherit;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:.3s;position:relative;overflow:hidden}
.btn.p{background:var(--pr);color:#fff;box-shadow:0 8px 20px rgba(91,33,182,.3)}.btn.p:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(91,33,182,.4)}
:root[data-theme="dark"] .btn.p{color:#0f0d1a}
.btn.o{background:transparent;border-color:var(--bd);color:var(--tx)}.btn.o:hover{border-color:var(--pr);color:var(--pr);transform:translateY(-3px)}
.sm{padding:8px 16px;font-size:13px}
.tg{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:16px;transition:.3s}.tg:hover{transform:rotate(25deg);border-color:var(--pr)}
.burger{display:none}
.hero{padding:72px 0 56px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;position:relative;z-index:1}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translate(30px,-30px) scale(1.1)}}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--pr);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700}
.badge b{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(34,197,94,.2)}}
h1{font-size:clamp(34px,5.4vw,56px);line-height:1.1;font-weight:800;letter-spacing:-.03em;margin:18px 0}
.gt{background:linear-gradient(90deg,var(--pr),#c084fc,var(--pr));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200%}}
.hero p.l{color:var(--mu);max-width:480px;font-size:15px}
.ctas{display:flex;gap:12px;margin:26px 0 18px;flex-wrap:wrap}
.loc{font-size:13px;color:var(--mu)}
.ph{position:relative;aspect-ratio:4/5;max-width:380px;margin:0 auto;border-radius:24px;background:linear-gradient(160deg,#4c1d95,#7c3aed 60%,#c084fc);box-shadow:var(--sh);overflow:hidden;display:grid;place-items:center;transition:transform .2s}
.ph svg{width:70%;opacity:.95}
.ph .cap{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);color:#1e1b2e;padding:8px 14px;border-radius:12px;font-size:12px;backdrop-filter:blur(8px)}
.ph .cap b{display:block;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 22px;display:flex;align-items:center;gap:16px;box-shadow:var(--sh)}
.st b{font-size:28px;font-weight:800;color:var(--pr)}.st span{font-size:13px;color:var(--mu);line-height:1.3}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:26px;box-shadow:var(--sh);transition:transform .25s,border-color .25s,box-shadow .25s;transform-style:preserve-3d}
.card:hover{border-color:var(--pr2);box-shadow:0 18px 40px rgba(124,58,237,.18)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pr);margin-bottom:10px}
.chip{display:inline-block;background:var(--soft);color:var(--pr);padding:4px 11px;border-radius:99px;font-size:11px;font-weight:600;margin:3px 4px 0 0}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.g2b{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.card h3{font-size:19px;font-weight:700;margin-bottom:10px}.card p{color:var(--mu);font-size:14px}
.q{border-left:3px solid var(--pr);padding:4px 0 4px 14px;margin-top:16px;font-style:italic;font-size:13px;color:var(--tx)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.ico{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;margin-bottom:14px}
.sk{margin-top:12px}.sk div.r{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.bar{height:6px;background:var(--soft);border-radius:9px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pr),#c084fc);border-radius:9px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.vis .bar i{width:var(--w)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.tabs button{padding:8px 18px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:600 13px inherit;font-family:inherit;cursor:pointer;transition:.25s}
.tabs button.on,.tabs button:hover{background:var(--pr);color:#fff;border-color:var(--pr)}
:root[data-theme="dark"] .tabs button.on{color:#0f0d1a}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.pj{padding:0;overflow:hidden;animation:pop .5s both}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(14px)}}
.pj .th{height:200px;position:relative;overflow:hidden}.pj .th::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-100%);transition:transform .8s}
.project-preview{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.pj:hover .th::after{transform:translateX(100%)}
.mock{position:absolute;inset:22px 26px 0;background:rgba(255,255,255,.92);border-radius:10px 10px 0 0;padding:12px;display:grid;gap:7px;align-content:start}
.mock i{display:block;height:8px;border-radius:4px;background:#ddd6fe}.mock i:nth-child(1){width:40%;background:#7c3aed}.mock i:nth-child(3){width:75%}.mock i:nth-child(4){height:36px;background:#ede9fe}
.pj .bd2{padding:20px}.pj h3{font-size:16px}.pj small{color:var(--pr);font-weight:600;font-size:11px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.ct{height:130px;border-radius:12px;background:linear-gradient(135deg,var(--soft),var(--bg2));border:1px solid var(--bd);display:grid;place-items:center;font-size:38px;margin-bottom:14px;transition:.3s}
.ct.certificate-image{height:170px;padding:8px;overflow:hidden;background:var(--card)}
.ct.certificate-image img{width:100%;height:100%;object-fit:contain}
.card:hover .ct{transform:scale(1.04) rotate(-1deg)}
.cg h3{font-size:14px}.cg p{font-size:12px}
.certificate-card{align-self:stretch}.certificate-copy h3{line-height:1.45}
.cg .certificate-copy p{margin-top:7px;line-height:1.6;overflow-wrap:anywhere}
.cg .certificate-copy .certificate-issuer{color:var(--pr);font-weight:700}
.cg .certificate-copy .certificate-date{font-size:11px;font-weight:600}
.cg .certificate-copy .certificate-description{font-size:12px}
.certificate-group{margin-bottom:28px}.certificate-group:last-child{margin-bottom:0}
.certificate-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:14px 18px;border:1px solid var(--bd);border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.certificate-bar small{display:block;font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--pr)}
.certificate-bar h3{font-size:17px;margin:1px 0 0}.certificate-icon{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:12px;background:var(--soft);font-size:20px}
.tl{position:relative;max-width:760px;margin:0 auto}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--bd)}
.tl::after{content:"";position:absolute;left:50%;top:0;width:2px;height:var(--tp,0%);background:var(--pr)}
.ti{width:50%;padding:0 38px 40px 0;position:relative}.ti:nth-child(even){margin-left:50%;padding:0 0 40px 38px}
.ti::before{content:"";position:absolute;right:-7px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--pr);border:3px solid var(--bg2);z-index:1}
.ti:nth-child(even)::before{right:auto;left:-7px}
.ti h4{font-size:15px;margin:4px 0}.ti p{font-size:13px;color:var(--mu)}
.ct2{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:start}
.ct2 h2{text-align:left}.ci{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);padding:14px 18px;border-radius:14px;margin-top:12px;font-size:14px;transition:.25s;text-decoration:none;color:var(--tx)}.ci:hover{transform:translateX(6px);border-color:var(--pr)}.ci small{display:block;color:var(--mu);font-size:11px}.ci b{display:block;font-size:14px;overflow-wrap:anywhere}
.social-icon{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:12px;background:var(--brand);color:#fff}.social-icon svg{width:23px;height:23px}.social-icon.whatsapp{--brand:#25d366}.social-icon.instagram{--brand:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}.social-icon.tiktok{--brand:#111}.social-icon.github{--brand:#24292f}.social-icon.email{--brand:var(--g1)}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fm .f{grid-column:1/-1}
label{font-size:12px;font-weight:600;display:block;margin-bottom:5px}
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:11px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px;transition:.25s}
input:focus,textarea:focus{outline:none;border-color:var(--pr2);box-shadow:0 0 0 4px var(--soft)}
footer{background:var(--bg2);border-top:1px solid var(--bd);padding:48px 0 24px}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}.fg a{display:block;color:var(--mu);font-size:13px;text-decoration:none;margin-top:6px}.fg a:hover{color:var(--pr)}
.fg h5{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.copy{border-top:1px solid var(--bd);margin-top:30px;padding-top:18px;font-size:12px;color:var(--mu);text-align:center}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.vis{opacity:1;transform:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;padding:12px 22px;border-radius:12px;z-index:200;animation:pop .4s}
@media(max-width:900px){
.links{position:fixed;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);padding:14px 24px;border-bottom:1px solid var(--bd);display:none}.links.open{display:flex}.burger{display:grid}
.hero .wrap,.g2,.g2b,.ct2{grid-template-columns:1fr}.g4,.cg{grid-template-columns:1fr 1fr}.g2e{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}
.hide-sm{display:none}section{padding:64px 0}}
@media(max-width:560px){.g4,.cg,.stats,.fm{grid-template-columns:1fr}.stats .st{padding:14px 18px}
.tl::before,.tl::after{left:8px}.ti,.ti:nth-child(even){width:100%;margin:0;padding:0 0 32px 34px}.ti::before,.ti:nth-child(even)::before{left:1px;right:auto}.fg{grid-template-columns:1fr}.wrap{padding:0 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ===== GRADASI ===== */
:root{--g1:linear-gradient(135deg,#5b21b6 0%,#7c3aed 50%,#c084fc 100%);--g2:linear-gradient(135deg,#ede9fe,#fae8ff);--gbg:radial-gradient(60% 55% at 90% 0%,rgba(192,132,252,.30),transparent 70%),radial-gradient(50% 50% at 0% 100%,rgba(124,58,237,.16),transparent 70%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:linear-gradient(135deg,#7c3aed 0%,#a78bfa 55%,#e879f9 100%);--g2:linear-gradient(135deg,#2a2350,#3d2063);--gbg:radial-gradient(60% 55% at 90% 0%,rgba(139,92,246,.30),transparent 70%),radial-gradient(50% 50% at 0% 100%,rgba(232,121,249,.12),transparent 70%)}}
:root[data-theme="dark"]{--g1:linear-gradient(135deg,#7c3aed 0%,#a78bfa 55%,#e879f9 100%);--g2:linear-gradient(135deg,#2a2350,#3d2063);--gbg:radial-gradient(60% 55% at 90% 0%,rgba(139,92,246,.30),transparent 70%),radial-gradient(50% 50% at 0% 100%,rgba(232,121,249,.12),transparent 70%)}
.hero{background:var(--gbg)}
.alt{background:linear-gradient(180deg,var(--bg2),color-mix(in srgb,var(--soft) 45%,var(--bg)))}
footer{background:linear-gradient(180deg,var(--bg2),var(--soft))}
.btn.p{background:var(--g1);background-size:160% 160%;background-position:0 50%}
.btn.p:hover{background-position:100% 50%}
.logo i,.links a.on,.tabs button.on,.toast{background:var(--g1);border-color:transparent}
.ico,.chip{background:var(--g2)}
.badge{background:var(--g2)}
.st b{background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{background:linear-gradient(90deg,var(--tx) 30%,var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{position:relative}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--g1);border-radius:18px 18px 0 0;opacity:0;transition:opacity .3s}
.card:hover::before{opacity:1}
.card:hover{background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--soft) 55%,var(--card)))}
.tl::after,.ti::before{background:var(--g1)}
.ct{background:var(--g2)}
.ci:hover{background:var(--g2)}

/* ===== KARTU 3D HERO ===== */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}@keyframes hcf{50%{transform:translateY(-12px)}}@keyframes chf{50%{translate:0 -10px}}@keyframes rot{to{transform:rotate(360deg)}}
.hc{perspective:1100px;max-width:380px;width:100%;margin:0 auto;position:relative}
.hc-ring{position:absolute;inset:-30px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--pr2) 55%,transparent);animation:rot 26s linear infinite}
.hc-float{animation:hcf 6s ease-in-out infinite}
.hc-card{position:relative;aspect-ratio:4/5;border-radius:26px;padding:2px;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .8s cubic-bezier(.2,.8,.2,1);background:conic-gradient(from var(--a),#c084fc,#7c3aed,#22d3ee,#e879f9,#c084fc);animation:spin 6s linear infinite;box-shadow:0 40px 70px -20px rgba(91,33,182,.6),0 0 40px rgba(192,132,252,.25)}
.hc-card.act{transition:transform .12s ease-out}
.hc-bg{position:absolute;inset:2px;border-radius:24px;overflow:hidden;background:radial-gradient(70% 50% at 80% 10%,rgba(232,121,249,.55),transparent 70%),linear-gradient(160deg,#2e1065,#5b21b6 50%,#9333ea 80%,#c026d3)}
.hc-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 45%,rgba(34,211,238,.25) 55%,transparent 70%);background-size:260% 260%;background-position:var(--mx,0%) var(--my,0%);transition:background-position .1s}
.hc-grid{position:absolute;inset:2px;border-radius:24px;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%);transform:translateZ(10px)}
.hc-top{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;color:rgba(255,255,255,.85);font-size:11px;font-weight:700;letter-spacing:.14em;transform:translateZ(30px)}
.hc-av{position:absolute;left:15%;width:70%;bottom:92px;filter:drop-shadow(0 22px 24px rgba(0,0,0,.4));transform:translateZ(55px)}
.hc-chip{position:absolute;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:700;box-shadow:0 14px 28px rgba(0,0,0,.28);animation:chf 4s ease-in-out infinite;white-space:nowrap}
.hc-chip.c1{top:20%;left:-28px;transform:translateZ(90px)}.hc-chip.c2{top:38%;right:-24px;transform:translateZ(80px);animation-delay:-1.3s}.hc-chip.c3{bottom:30%;left:-20px;transform:translateZ(100px);animation-delay:-2.6s}
.hc-name{position:absolute;left:14px;right:14px;bottom:14px;padding:13px 16px;border-radius:18px;background:rgba(255,255,255,.15);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.32);color:#fff;transform:translateZ(75px);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hc-name b{display:block;font-size:17px}.hc-name small{font-size:11px;opacity:.85}
.hc-on{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;background:rgba(34,197,94,.25);padding:4px 10px;border-radius:99px}.hc-on i{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:pl 1.6s infinite}
.hc-bar{flex-basis:100%;height:12px;border-radius:2px;opacity:.55;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px,#fff 5px 6px,transparent 6px 10px)}
.hc-glare{position:absolute;inset:2px;border-radius:24px;pointer-events:none;background:radial-gradient(circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.4),transparent 45%);mix-blend-mode:overlay;opacity:0;transition:opacity .3s;transform:translateZ(120px)}
.hc-card.act .hc-glare{opacity:1}
@media(max-width:560px){.hc-chip.c1{left:-6px}.hc-chip.c2{right:-6px}.hc-chip.c3{left:-4px}.hc-ring{display:none}}

/* ===== EFEK MENGETIK ===== */
.hi{font-size:clamp(18px,2.6vw,24px);font-weight:700;margin-bottom:10px;min-height:1.6em;display:flex;flex-wrap:wrap;align-items:center;gap:0 .35em}
.hi .tw{background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:-.01em}

/* ===== POLISH UI/UX ===== */

.skip{position:fixed;left:12px;top:-70px;z-index:300;background:var(--pr);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none;transition:top .2s}.skip:focus{top:12px}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}

.rv{opacity:0;transform:none;transition:none}

function useReveal(){useEffect(()=>{const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add("vis")),{threshold:.15});document.querySelectorAll(".rv").forEach(n=>io.observe(n));return()=>io.disconnect()},[])}
function Tilt({children,className="",...p}){const r=useRef();const mv=e=>{const b=r.current.getBoundingClientRect();const x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;r.current.style.transform=`perspective(800px) rotateY(${x*7}deg) rotateX(${-y*7}deg) translateY(-4px)`};

function Count({to,suffix=""}){const [n,setN]=useState(0);const r=useRef();useEffect(()=>{const io=new IntersectionObserver(([e])=>{if(!e.isIntersecting)return;io.disconnect();let t0;const f=t=>{t0=t0||t;const p=Math.min((t-t0)/1500,1);setN(Math.round(to*(1-Math.pow(1-p,3))));p<1&&requestAnimationFrame(f)};requestAnimationFrame(f)});io.observe(r.current);return()=>io.disconnect()},[]);return <b ref={r}>{n}{suffix}</b>}
